<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" role="img" aria-labelledby="ecosystem-title ecosystem-desc" xml:lang="en">
  <title id="ecosystem-title">The Eyleme ecosystem working together</title>
  <desc id="ecosystem-desc">The Eyleme ecosystem as a triangle: Eyleme at the top for open source and action, Derleme at the lower left for field data recorded in the cloud or on premises, and Onama at the lower right for security, authority, responsibility and regulatory workflows. Arrows show data from Derleme to Onama, authority from Onama to Eyleme, and feedback from Eyleme to Derleme. Planned collaboration; products are in development.</desc>
  <defs>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9161"/><stop offset=".5" stop-color="#ee5638"/><stop offset="1" stop-color="#b63e28"/></linearGradient>
  </defs>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#17252b">
    <path d="M320 124 114 446H526Z" fill="#ee5638" fill-opacity=".035" stroke="url(#copper)" stroke-width="18" stroke-linejoin="round"/>
    <path d="M221 279l-16 25 0-14m0 14 13-6M305 446h30l-10-8m10 8-10 8M431 298l-16-25 0 14m0-14 13 6" fill="none" stroke="#f7f6f2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#f7f6f2" stroke="#ee5638" stroke-width="6"><circle cx="320" cy="124" r="20"/><circle cx="114" cy="446" r="20"/><circle cx="526" cy="446" r="20"/></g>
    <g fill="#ee5638"><circle cx="320" cy="124" r="6"/><circle cx="114" cy="446" r="6"/><circle cx="526" cy="446" r="6"/></g>
    <g font-size="38" font-weight="700" letter-spacing="-1.4"><text x="320" y="48">Eyleme</text><text x="114" y="512">Derleme</text><text x="526" y="512">Onama</text></g>
    <g font-size="21" fill="#5d676b"><text x="320" y="80">Open source · Action</text><text x="114" y="545">Field data</text><text x="526" y="545">Security · Authority</text></g>
    <g font-size="17" fill="#5d676b"><text x="114" y="575">Cloud / On premises</text><text x="526" y="575">Responsibility · Regulations</text></g>
    <g font-size="20" font-weight="500" fill="#b63e28"><text x="165" y="278" transform="rotate(-57.4 165 278)">Feedback</text><text x="478" y="278" transform="rotate(57.4 478 278)">Authority</text><text x="320" y="416">Data</text></g>
    <text x="320" y="324" font-size="36" font-weight="650" letter-spacing="-1">Together.</text><text x="320" y="357" font-size="21" fill="#5d676b">One ecosystem.</text>
  </g>
</svg>
