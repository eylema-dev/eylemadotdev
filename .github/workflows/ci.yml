name: Website checks
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Environment and revision
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python --version
          git rev-parse HEAD
          python -c "import os; print('PR head:', os.environ.get('PR_HEAD_SHA', ''))"
      - name: Install tooling
        run: python -m pip install --require-hashes -r tools/requirements-ci.txt
      - name: Regression tests
        run: python -m unittest discover -s tools/tests -v
      - name: Repository and generated website
        run: |
          python tools/build.py --check
          python tools/check_repository.py
          git show --format= --check HEAD
          git diff --check
      - name: Actual PR description
        if: github.event_name == 'pull_request'
        run: python tools/check_pr.py --event "$GITHUB_EVENT_PATH"
