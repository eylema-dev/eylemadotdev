name: Deploy Eylema website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-swa-eylema-dev
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Validate source and generated output
        run: |
          python --version
          git rev-parse HEAD
          python -m pip install --require-hashes -r tools/requirements-ci.txt
          python -m unittest discover -s tools/tests -v
          python tools/build.py --check
          python tools/check_repository.py
          python tools/check_pr.py --body-file .github/PULL_REQUEST_TEMPLATE.md --allow-template
          git show --format= --check HEAD
          git diff --check
      - name: Stamp release
        run: python tools/release.py --commit "$GITHUB_SHA"
      - name: Deploy prebuilt website
        id: upload
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SWA_EYLEMA_DEV }}
          action: upload
          app_location: public
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main
      - name: Verify live canonical host
        env:
          SITE_URL: https://eylema.dev
        run: |
          for attempt in 1 2 3; do
            if python tools/check_live.py --url "$SITE_URL" --commit "$GITHUB_SHA"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          exit 1
